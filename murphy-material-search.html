<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Murphy 教材搜尋台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF6EE; --ink:#4A3B32; --ink-soft:#8A7B6E;
    --sage:#6B8E76; --sage-soft:#C6DACB; --line:#E9DFCF; --card:#FFFFFF;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:'Noto Sans TC',sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:640px;margin:0 auto;padding:32px 16px 90px;}
  .brand{text-align:center;font-family:'Fredoka',sans-serif;font-weight:600;font-size:14px;letter-spacing:1.5px;color:var(--sage);text-transform:lowercase;margin-bottom:4px;}
  h1{font-family:'Fredoka',sans-serif;font-weight:600;font-size:24px;text-align:center;margin:0 0 8px;}
  .sub{text-align:center;color:var(--ink-soft);font-size:13px;margin-bottom:24px;}

  .search-box{position:relative;margin:0 auto 22px;}
  .search-box input{width:100%;padding:15px 46px 15px 18px;font-size:16px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-family:'Noto Sans TC',sans-serif;outline:none;transition:.2s;}
  .search-box input:focus{border-color:var(--sage);box-shadow:0 0 0 4px var(--sage-soft);}
  .search-box .icon{position:absolute;right:17px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--ink-soft);pointer-events:none;}

  .toolbar{display:flex;justify-content:center;gap:10px;margin-bottom:22px;flex-wrap:wrap;}
  .btn{font-family:'Noto Sans TC',sans-serif;font-weight:500;font-size:13px;padding:8px 16px;border-radius:10px;border:none;cursor:pointer;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--sage);color:#fff;}
  .btn-ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line);}

  .landing{text-align:center;padding:40px 20px 20px;color:var(--ink-soft);}
  .landing .big{font-size:38px;margin-bottom:10px;}
  .landing p{font-size:13px;line-height:1.7;max-width:320px;margin:0 auto;}

  .sr-item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:9px;}
  .sr-title{font-weight:700;font-size:14.5px;}
  .sr-badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;}
  .badge{font-size:10.5px;padding:2px 9px;border-radius:999px;background:var(--sage-soft);color:var(--sage);}
  .sr-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;}
  .tag-pill{font-size:10px;color:var(--ink-soft);border:1px solid var(--line);padding:2px 8px;border-radius:999px;}
  .sr-note{font-size:12px;color:var(--ink-soft);margin-top:6px;line-height:1.5;}
  .no-results{text-align:center;color:var(--ink-soft);font-size:13px;padding:30px 0;}

  .modal-bg{position:fixed;inset:0;background:rgba(74,59,50,.4);display:none;align-items:flex-end;justify-content:center;z-index:50;}
  .modal-bg.open{display:flex;}
  .modal{background:var(--cream);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 18px 24px;max-height:88vh;overflow-y:auto;}
  @media (min-width:600px){.modal-bg{align-items:center;} .modal{border-radius:20px;margin-bottom:40px;}}
  .modal h2{font-family:'Fredoka',sans-serif;font-size:18px;margin:0 0 14px;}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:5px;}
  .field input[type=text],.field textarea{width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--line);font-family:'Noto Sans TC',sans-serif;font-size:13.5px;background:#fff;color:var(--ink);resize:vertical;}
  .chip-group{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{padding:6px 12px;border-radius:999px;border:1.5px solid var(--line);font-size:12px;cursor:pointer;background:#fff;color:var(--ink-soft);user-select:none;}
  .chip.on{background:var(--sage);border-color:var(--sage);color:#fff;}
  .modal-actions{display:flex;gap:10px;margin-top:18px;}
  .modal-actions .btn{flex:1;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:60;}
  .toast.show{opacity:1;}
  .manage-item{display:flex;justify-content:space-between;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:8px;}
  .manage-item .mi-title{font-weight:700;font-size:13px;}
  .manage-item .mi-sub{font-size:11px;color:var(--ink-soft);margin-top:2px;}
  .manage-item button{background:none;border:none;color:#C0685C;font-size:11.5px;cursor:pointer;padding:3px 5px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">fammys</div>
  <h1>Murphy 教材搜尋台</h1>
  <div class="sub">打她今天想玩的主題，相關教材直接撈出來</div>

  <div class="search-box">
    <input id="searchInput" type="text" placeholder="她說想玩什麼，就打什麼…" autocomplete="off">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
  </div>

  <div class="toolbar">
    <button class="btn btn-primary" id="addBtn">＋ 新增教材</button>
    <button class="btn btn-ghost" id="manageBtn">管理教材庫</button>
  </div>

  <div id="results"></div>
</div>

<div class="modal-bg" id="interestBg">
  <div class="modal">
    <h2>福福最近迷什麼？</h2>
    <div class="field">
      <label>用逗號分隔，最多6個（例如：狗, 餐廳, 恐龍）</label>
      <input type="text" id="f_interests" placeholder="狗, 餐廳, 恐龍">
      <div style="font-size:11px;color:var(--ink-soft);margin-top:6px;">符合這些的教材會自動排在搜尋結果最前面。過陣子她迷別的，回來改就好。</div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="document.getElementById('interestBg').classList.remove('open')">取消</button>
      <button class="btn btn-primary" onclick="saveInterestsFromModal()">儲存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h2 id="modalTitle">新增教材</h2>
    <input type="hidden" id="editId">
    <div class="field"><label>品項名稱</label><input type="text" id="f_title" placeholder="例如：Brown Bear, Brown Bear"></div>
    <div class="field"><label>所有可能的標籤（用逗號分隔，能想到幾個打幾個 — 主題、顏色、情境、詞彙都算，例如：熊, 棕色, 動物, 花紋, 重複句型）</label>
      <input type="text" id="f_tags" placeholder="熊, 棕色, 動物, 花紋">
    </div>
    <div class="field"><label>類型（可複選）</label><div class="chip-group" id="catChips"></div></div>
    <div class="field"><label>年齡層</label><input type="text" id="f_age" placeholder="例如：3-5歲"></div>
    <div class="field"><label>延伸玩法／備註</label><textarea id="f_note" rows="2"></textarea></div>
    <div class="field"><label>位置／來源</label><input type="text" id="f_loc"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="cancelBtn">取消</button>
      <button class="btn btn-primary" id="saveBtn">儲存</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="manageBg">
  <div class="modal">
    <h2>管理教材庫</h2>
    <div id="manageList"></div>
    <div class="modal-actions"><button class="btn btn-ghost" id="closeManage">關閉</button></div>
  </div>
</div>

  {id:cid(),title:"注音符號繪本書單（收藏待啟動）",tags:["注音","ㄅㄆㄇ","書單","收藏","待啟動","大班"],cats:["繪本"],age:"5-6歲",note:"家長分享的注音啟蒙書單：一符號一繪本，附小康軒替換對照（多可從康軒訂閱贈書取得）。替換書例：ㄅ我的神祕保母/ㄆ莫莫交朋友/ㄈ小飛龍來我家/ㄉ對你說謝謝/ㄊ我們救了一頭大睡鯨/ㄐ神祕到骨頭照相機/ㄓ尋找朱鷺五百里/ㄘ對你說一百次謝謝/ㄙ自私浣熊的洗洗店/一貓咪家的失望大餐/ㄨ露露好害怕/ㄚ最勇敢的大牙/ㄛ多多的不害羞練習/ㄜ為你做一件泳衣/ㄝ小飛龍當姐姐/ㄣ老虎的守護神/ㄤ小飛龍去上學/ㄦ聲音王國的挑戰。啟動時機：CVC五短母音穩定後（約3-4個月後）再評估",loc:"收藏"},

let materials = [];
let editingChips = {cats:new Set()};
let interests = [];
const STORE_KEY_INTERESTS = "interests_v1";

async function loadInterests(){
  try{
    const res = await window.storage.get(STORE_KEY_INTERESTS, false);
    interests = res && res.value ? JSON.parse(res.value) : [];
  }catch(e){ interests = []; }
}
async function saveInterests(){
  try{ await window.storage.set(STORE_KEY_INTERESTS, JSON.stringify(interests), false); }
  catch(e){ showToast("儲存失敗"); }
}
function interestScore(m){
  if(interests.length===0) return 0;
  const hay = (m.title+' '+m.tags.join(' ')).toLowerCase();
  return interests.reduce((s,it)=> s + (hay.includes(it.toLowerCase())?1:0), 0);
}
function editInterests(){
  document.getElementById('f_interests').value = interests.join(', ');
  document.getElementById('interestBg').classList.add('open');
  setTimeout(()=>document.getElementById('f_interests').focus(), 100);
}
async function saveInterestsFromModal(){
  const input = document.getElementById('f_interests').value;
  interests = input.split(/[,，、]/).map(s=>s.trim()).filter(Boolean).slice(0,6);
  await saveInterests();
  document.getElementById('interestBg').classList.remove('open');
  renderLanding();
  showToast('已更新最近迷');
}

async function loadData(){
  try{
    const res = await window.storage.get(STORE_KEY_MATERIALS, false);
    if(res && res.value){
      materials = JSON.parse(res.value);
      // Merge in any new default entries that aren't already present (by title),
      // so future updates to the tool's built-in list reach devices that already
      // have saved data, without touching anything the person added themselves.
      const existingTitles = new Set(materials.map(m=>m.title));
      let mergedAny = false;
      seed.forEach(s=>{
        if(!existingTitles.has(s.title)){
          materials.push(s);
          mergedAny = true;
        }
      });
      if(mergedAny){ await saveMaterials(); }
    } else {
      materials = seed;
      await saveMaterials();
    }
  }catch(e){ materials = seed; try{await saveMaterials();}catch(e2){} }
  renderLanding();
}
async function saveMaterials(){
  try{ await window.storage.set(STORE_KEY_MATERIALS, JSON.stringify(materials), false); }
  catch(e){ showToast("儲存失敗，請再試一次"); }
}
function showToast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1800);
}

function renderLanding(){
  const intHtml = interests.length
    ? interests.map(i=>`<span style="background:var(--sage-soft);color:var(--sage);padding:3px 10px;border-radius:999px;font-size:12px;">⭐ ${escapeHtml(i)}</span>`).join(' ')
    : '<span style="color:var(--ink-soft);font-size:12px;">還沒設定</span>';
  document.getElementById('results').innerHTML = `
    <div class="landing">
      <div class="big">🔎</div>
      <p>打主題（狗、天氣）、情境（野餐、下雨天、生病）、玩法（桌遊、扮演）、時間（5分鐘、10分鐘）、大人程度（自己玩、一起玩）或地點（車上、睡前）。</p>
      <div style="margin-top:22px;">
        <div style="font-size:12px;font-weight:700;color:var(--ink);margin-bottom:8px;">福福最近迷</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;">
          ${intHtml}
          <button onclick="editInterests()" style="border:1px solid var(--line);background:#fff;color:var(--ink-soft);padding:3px 10px;border-radius:999px;font-size:11px;cursor:pointer;font-family:'Noto Sans TC',sans-serif;">✎ 編輯</button>
        </div>
        <div style="font-size:10.5px;color:var(--ink-soft);margin-top:6px;">符合這些的教材會自動排在搜尋結果最前面</div>
      </div>
    </div>`;
}

function expandQuery(q){
  const terms = new Set([q]);
  SYNONYMS.forEach(group=>{
    if(group.some(w=>w.toLowerCase().includes(q) || q.includes(w.toLowerCase()))){
      group.forEach(w=>terms.add(w.toLowerCase()));
    }
  });
  return [...terms];
}

let searchTimer;
document.getElementById('searchInput').addEventListener('input', ()=>{
  clearTimeout(searchTimer);
  searchTimer = setTimeout(()=>{
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    if(!q){ renderLanding(); return; }
    const terms = expandQuery(q);
    const matched = materials.filter(m=>{
      const hay = (m.title+' '+m.tags.join(' ')+' '+(m.note||'')+' '+m.cats.join(' ')).toLowerCase();
      return terms.some(t=>hay.includes(t));
    });
    matched.sort((a,b)=>interestScore(b)-interestScore(a));
    showResults(matched);
  },150);
});

function showResults(list){
  const box = document.getElementById('results');
  if(list.length===0){
    box.innerHTML = `<div class="no-results">目前沒有相關教材 — 這也是提醒妳可以補的訊號</div>`;
    return;
  }
  box.innerHTML = list.map(m=>{
    const catBadges = m.cats.map(c=>{
      const def = CATS.find(x=>x.key===c);
      return `<span class="badge">${def?def.emoji:''} ${c}</span>`;
    }).join('');
    const tagPills = m.tags.map(t=>`<span class="tag-pill">${escapeHtml(t)}</span>`).join('');
    return `<div class="sr-item">
      <div class="sr-title">${escapeHtml(m.title)}</div>
      <div class="sr-badges">${catBadges}</div>
      <div class="sr-tags">${tagPills}</div>
      ${m.note?`<div class="sr-note">${escapeHtml(m.note)}</div>`:''}
    </div>`;
  }).join('');
}

function buildChips(containerId, options, selectedSet, labelFn){
  const c = document.getElementById(containerId);
  c.innerHTML = '';
  options.forEach(opt=>{
    const key = typeof opt === 'string' ? opt : opt.key;
    const chip = document.createElement('div');
    chip.className = 'chip'+(selectedSet.has(key)?' on':'');
    chip.textContent = labelFn ? labelFn(opt) : key;
    chip.onclick = ()=>{
      if(selectedSet.has(key)) selectedSet.delete(key); else selectedSet.add(key);
      chip.classList.toggle('on');
    };
    c.appendChild(chip);
  });
}
function openAddModal(existing){
  editingChips = { cats:new Set(existing?existing.cats:[]) };
  document.getElementById('modalTitle').textContent = existing?'編輯教材':'新增教材';
  document.getElementById('editId').value = existing?existing.id:'';
  document.getElementById('f_title').value = existing?existing.title:'';
  document.getElementById('f_tags').value = existing?existing.tags.join(', '):'';
  document.getElementById('f_age').value = existing?existing.age:'';
  document.getElementById('f_note').value = existing?existing.note:'';
  document.getElementById('f_loc').value = existing?existing.loc:'';
  buildChips('catChips', CATS, editingChips.cats, c=>c.emoji+' '+c.key);
  document.getElementById('modalBg').classList.add('open');
}
document.getElementById('addBtn').onclick = ()=>openAddModal(null);
document.getElementById('cancelBtn').onclick = ()=>document.getElementById('modalBg').classList.remove('open');
document.getElementById('saveBtn').onclick = async ()=>{
  const title = document.getElementById('f_title').value.trim();
  if(!title){ showToast('請填品項名稱'); return; }
  const tags = document.getElementById('f_tags').value.split(',').map(s=>s.trim()).filter(Boolean);
  const id = document.getElementById('editId').value;
  const data = {
    id: id||cid(), title, tags,
    cats:[...editingChips.cats],
    age: document.getElementById('f_age').value.trim(),
    note: document.getElementById('f_note').value.trim(),
    loc: document.getElementById('f_loc').value.trim(),
  };
  if(id){ materials = materials.map(m=>m.id===id?data:m); } else { materials.push(data); }
  await saveMaterials();
  document.getElementById('modalBg').classList.remove('open');
  showToast('已儲存');
  if(document.getElementById('searchInput').value.trim()){
    document.getElementById('searchInput').dispatchEvent(new Event('input'));
  }
};

document.getElementById('manageBtn').onclick = ()=>{ renderManageList(); document.getElementById('manageBg').classList.add('open'); };
document.getElementById('closeManage').onclick = ()=>document.getElementById('manageBg').classList.remove('open');
function renderManageList(){
  const list = document.getElementById('manageList');
  if(materials.length===0){ list.innerHTML='<div class="no-results">還沒有教材</div>'; return; }
  list.innerHTML='';
  materials.forEach(m=>{
    const row=document.createElement('div'); row.className='manage-item';
    row.innerHTML=`<div><div class="mi-title">${escapeHtml(m.title)}</div><div class="mi-sub">${m.cats.join('、')} · ${m.tags.join(', ')}</div></div>
      <div style="display:flex;gap:6px;"><button data-act="edit">編輯</button><button data-act="del">刪除</button></div>`;
    row.querySelector('[data-act="edit"]').onclick = ()=>{ document.getElementById('manageBg').classList.remove('open'); openAddModal(m); };
    row.querySelector('[data-act="del"]').onclick = async ()=>{
      if(!confirm(`確定要刪除「${m.title}」嗎？`)) return;
      materials = materials.filter(x=>x.id!==m.id);
      await saveMaterials(); renderManageList();
      showToast('已刪除');
    };
    list.appendChild(row);
  });
}
